[project]
name = "agentgen"
version = "0.1.0"
description = "Turns business requirements into tested, versioned AI agents."
requires-python = ">=3.10"
dependencies = ["anthropic>=1.13", "pydantic>=2", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentgen = "agentgen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentgen"]
